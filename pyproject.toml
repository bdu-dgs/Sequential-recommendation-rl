[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seqrec-rl"
version = "0.1.0"
description = "Support-aware offline-to-online RL for sequential recommendation (KuaiRec + controlled simulation)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: tests that need the processed KuaiRec data"]
